<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carga de horas - New Garden</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #1d2939;
      --muted: #667085;
      --border: #d0d5dd;
      --primary: #c50039;
      --primary-dark: #9f002e;
      --focus: rgba(197, 0, 57, .18);
      --danger: #b42318;
      --ok: #067647;
      --warning: #b54708;
      --shadow: 0 18px 45px rgba(16, 24, 40, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .page-logo {
      position: fixed;
      right: 0;
      bottom: 0;
      width: min(40vw, 390px);
      max-height: 48vh;
      object-fit: contain;
      object-position: right bottom;
      opacity: .13;
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(820px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
      margin-bottom: 18px;
    }

    .brand {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 5px 0 0;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.08;
    }

    .date-pill {
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--muted);
      background: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    input[readonly] {
      background: #f8fafc;
      color: #475467;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid var(--focus);
      border-color: var(--primary);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 22px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .6;
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.error {
      color: var(--danger);
    }

    .status.warning {
      color: var(--warning);
    }

    iframe {
      display: none;
    }

    @media (max-width: 680px) {
      main {
        padding: 18px 0;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      form {
        padding: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: stretch;
      }

      button {
        width: 100%;
      }

      .page-logo {
        width: 56vw;
        max-height: 34vh;
        opacity: .1;
      }
    }
  </style>
</head>
<body>
  <img class="page-logo" src="isotipo.png" alt="">

  <main>
    <header>
      <div>
        <div class="brand">New Garden</div>
        <h1>Carga de horas</h1>
      </div>
      <div class="date-pill" id="todayLabel"></div>
    </header>

    <form id="hoursForm" method="post" target="submitFrame">
      <div class="grid">
        <div class="field">
          <label for="fecha">Fecha</label>
          <input id="fecha" name="fecha" type="date" required>
        </div>

        <div class="field">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" required>
            <option value="">Seleccionar</option>
            <option value="Horas a favor">Horas a favor</option>
            <option value="Horas a descontar">Horas a descontar</option>
          </select>
        </div>

        <div class="field">
          <label for="dni">DNI</label>
          <input id="dni" name="dni" inputmode="numeric" autocomplete="off" required>
          <div class="hint" id="employeeHint">Ingresar DNI sin puntos.</div>
        </div>

        <div class="field">
          <label for="nombre">Apellido y nombre</label>
          <input id="nombre" name="nombre" readonly required>
        </div>

        <div class="field">
          <label for="local">Local</label>
          <select id="local" name="local" required></select>
          <div class="hint">Se completa por nomina, pero se puede cambiar.</div>
        </div>

        <div class="field">
          <label for="cantidad">Cantidad de horas</label>
          <input id="cantidad" name="cantidad" type="number" min="0.25" step="0.25" required>
          <div class="hint">Usar decimales: 1.5 equivale a una hora y media.</div>
        </div>

        <div class="field full">
          <label for="motivo">Motivo</label>
          <textarea id="motivo" name="motivo" required></textarea>
        </div>
      </div>

      <input id="registradoDesde" name="registradoDesde" type="hidden" value="GitHub Pages">

      <div class="actions">
        <button id="submitButton" type="submit" disabled>Enviar</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>

    <iframe name="submitFrame" id="submitFrame" title="Envio de formulario"></iframe>
  </main>

  <script src="nomina.js"></script>
  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyCnHBe3NhPE5IABgTz89JDsk81LhZCkSLAJe3JwGSG09eGW-K6aUIl1WAiEPW06-KriA/exec';

    const NOMINA = window.NOMINA || [];
    const LOCALES_EXTRA = window.LOCALES_EXTRA || [];

    const form = document.querySelector('#hoursForm');
    const submitButton = document.querySelector('#submitButton');
    const statusBox = document.querySelector('#status');
    const frame = document.querySelector('#submitFrame');
    const dniInput = document.querySelector('#dni');
    const nombreInput = document.querySelector('#nombre');
    const localSelect = document.querySelector('#local');
    const employeeHint = document.querySelector('#employeeHint');
    const today = new Date();
    const localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000);
    const employeesByDni = new Map(NOMINA.map(employee => [normalizeDni(employee.dni), employee]));

    document.querySelector('#fecha').value = localToday.toISOString().slice(0, 10);
    document.querySelector('#todayLabel').textContent = today.toLocaleDateString('es-AR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    });

    function normalizeDni(value) {
      return String(value || '').replace(/\D/g, '');
    }

    function setStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = type ? `status ${type}` : 'status';
    }

    function getLocales() {
      const locales = new Set(LOCALES_EXTRA);
      NOMINA.forEach(employee => {
        if (employee.local) locales.add(employee.local);
      });
      return Array.from(locales)
        .filter(local => local !== 'RH')
        .sort((a, b) => a.localeCompare(b, 'es'));
    }

    function renderLocalOptions(selectedLocal) {
      const options = ['<option value="">Seleccionar local</option>'];
      getLocales().forEach(local => {
        const selected = local === selectedLocal ? ' selected' : '';
        options.push(`<option value="${local}"${selected}>${local}</option>`);
      });
      localSelect.innerHTML = options.join('');
    }

    function updateEmployeeFromDni() {
      const dni = normalizeDni(dniInput.value);
      dniInput.value = dni;

      if (!dni) {
        nombreInput.value = '';
        renderLocalOptions('');
        submitButton.disabled = true;
        employeeHint.textContent = 'Ingresar DNI sin puntos.';
        employeeHint.style.color = '';
        return;
      }

      const employee = employeesByDni.get(dni);
      if (!employee) {
        nombreInput.value = '';
        renderLocalOptions('');
        submitButton.disabled = true;
        employeeHint.textContent = 'DNI no encontrado en la nomina.';
        employeeHint.style.color = '#b42318';
        return;
      }

      nombreInput.value = employee.nombre;
      renderLocalOptions(employee.local);
      submitButton.disabled = false;
      employeeHint.textContent = 'Empleado encontrado.';
      employeeHint.style.color = '#067647';
    }

    renderLocalOptions('');
    dniInput.addEventListener('input', updateEmployeeFromDni);

    form.addEventListener('submit', (event) => {
      if (WEB_APP_URL.includes('PEGAR_ACA')) {
        event.preventDefault();
        setStatus('Falta configurar la URL del Apps Script.', 'error');
        return;
      }

      if (!employeesByDni.has(normalizeDni(dniInput.value))) {
        event.preventDefault();
        setStatus('El DNI no esta en la nomina.', 'error');
        return;
      }

      form.action = WEB_APP_URL;
      submitButton.disabled = true;
      setStatus('Enviando...', 'warning');
    });

    frame.addEventListener('load', () => {
      if (!statusBox.textContent.includes('Enviando')) return;

      submitButton.disabled = true;
      form.reset();
      document.querySelector('#fecha').value = localToday.toISOString().slice(0, 10);
      nombreInput.value = '';
      renderLocalOptions('');
      employeeHint.textContent = 'Ingresar DNI sin puntos.';
      employeeHint.style.color = '';
      setStatus('Carga enviada correctamente.', 'ok');
    });
  </script>
</body>
</html>
