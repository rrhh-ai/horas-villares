<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carga de horas - New Garden</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #1d2939;
      --muted: #667085;
      --border: #d0d5dd;
      --primary: #c50039;
      --primary-dark: #9f002e;
      --focus: rgba(197, 0, 57, .18);
      --danger: #b42318;
      --ok: #067647;
      --warning: #b54708;
      --shadow: 0 18px 45px rgba(16, 24, 40, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .page-logo {
      position: fixed;
      right: 0;
      bottom: 0;
      width: min(40vw, 390px);
      max-height: 48vh;
      object-fit: contain;
      object-position: right bottom;
      opacity: .13;
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(820px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
      margin-bottom: 18px;
    }

    .brand {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 5px 0 0;
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.08;
    }

    .date-pill {
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--muted);
      background: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .consult-input-grid {
      align-items: start;
    }

    .consult-input-grid input {
      min-height: 66px;
      font-size: 22px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    input[readonly] {
      background: #f8fafc;
      color: #475467;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid var(--focus);
      border-color: var(--primary);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }

    .actions.between {
      justify-content: space-between;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 22px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    .secondary-button:hover {
      background: #f8fafc;
    }

    .ghost-button {
      background: transparent;
      color: var(--primary);
      padding: 0;
      min-height: auto;
    }

    .ghost-button:hover {
      background: transparent;
      color: var(--primary-dark);
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .6;
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.error {
      color: var(--danger);
    }

    .status.warning {
      color: var(--warning);
    }

    iframe {
      display: none;
    }

    .hidden {
      display: none;
    }

    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      margin: 0;
    }

    .summary-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      background: #f8fafc;
      text-align: center;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .consult-summary-row {
      display: grid;
      grid-template-columns: minmax(260px, max-content) minmax(260px, 1fr);
      align-items: stretch;
      gap: 14px;
      margin: 18px 0;
    }

    .name-colon {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }

    .person-title {
      display: flex;
      align-items: center;
      min-height: 88px;
      margin: 0;
    }

    .summary-item.positive {
      border-color: #abefc6;
      background: #ecfdf3;
    }

    .summary-item.negative {
      border-color: #fecdca;
      background: #fef3f2;
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .summary-value {
      margin-top: 5px;
      font-size: 24px;
      font-weight: 700;
    }

    .history-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    @media (max-width: 680px) {
      main {
        padding: 18px 0;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        width: 100%;
        justify-content: space-between;
      }

      form {
        padding: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: stretch;
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .ghost-button {
        width: auto;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .consult-summary-row {
        grid-template-columns: 1fr;
      }

      .person-title {
        min-height: auto;
      }

      .name-colon {
        font-size: 20px;
      }

      .page-logo {
        width: 56vw;
        max-height: 34vh;
        opacity: .1;
      }
    }
  </style>
</head>
<body>
  <img class="page-logo" src="isotipo.png" alt="">

  <main>
    <header>
      <div>
        <div class="brand">New Garden</div>
        <h1>Carga de horas</h1>
      </div>
      <div class="header-actions">
        <button class="secondary-button" id="openConsultButton" type="button">Consultar mis horas</button>
        <div class="date-pill" id="todayLabel"></div>
      </div>
    </header>

    <form id="hoursForm" method="post" target="submitFrame">
      <div class="grid">
        <div class="field">
          <label for="fecha">Fecha</label>
          <input id="fecha" name="fecha" type="date" required>
        </div>

        <div class="field">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" required>
            <option value="">Seleccionar</option>
            <option value="Horas a favor">Horas a favor</option>
            <option value="Horas a descontar">Horas a descontar</option>
          </select>
        </div>

        <div class="field">
          <label for="dni">DNI</label>
          <input id="dni" name="dni" inputmode="numeric" autocomplete="off" required>
          <div class="hint" id="employeeHint">Ingresar DNI sin puntos.</div>
        </div>

        <div class="field">
          <label for="nombre">Apellido y nombre</label>
          <input id="nombre" name="nombre" readonly required>
        </div>

        <div class="field">
          <label for="local">Local</label>
          <select id="local" name="local" required></select>
          <div class="hint">Se completa por nomina, pero se puede cambiar.</div>
        </div>

        <div class="field">
          <label for="cantidad">Cantidad de horas</label>
          <input id="cantidad" name="cantidad" type="number" min="0.25" step="0.25" required>
          <div class="hint">Usar decimales: 1.5 equivale a una hora y media.</div>
        </div>

        <div class="field full">
          <label for="motivo">Motivo</label>
          <textarea id="motivo" name="motivo" required></textarea>
        </div>
      </div>

      <input id="registradoDesde" name="registradoDesde" type="hidden" value="GitHub Pages">

      <div class="actions">
        <button id="submitButton" type="submit" disabled>Enviar</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>

    <section class="panel hidden" id="consultPanel">
      <div class="grid consult-input-grid">
        <div class="field">
          <label for="consultDni">DNI</label>
          <input id="consultDni" inputmode="numeric" autocomplete="off">
          <div class="hint" id="consultHint">Ingresar DNI sin puntos.</div>
        </div>

        <div class="field">
          <label for="consultNombre">Apellido y nombre</label>
          <input id="consultNombre" readonly>
        </div>
      </div>

      <div class="actions">
        <button id="runConsultButton" type="button" disabled>Aceptar</button>
      </div>

      <div id="consultStatus" class="status" role="status" aria-live="polite"></div>

      <div class="hidden" id="consultResult">
        <div class="consult-summary-row">
          <h2 class="person-title"><span id="resultName"></span><span class="name-colon">:</span></h2>

          <div class="summary">
            <div class="summary-item" id="saldoCard">
              <div class="summary-label">Horas disponibles</div>
              <div class="summary-value" id="saldoHoras">0</div>
            </div>
          </div>
        </div>

        <div class="history-wrap">
          <table>
            <thead>
              <tr>
                <th>Fecha de carga</th>
                <th>Apellido nombre</th>
                <th>Horas a favor</th>
                <th>Horas descontadas</th>
                <th>Motivo</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>

        <div class="actions">
          <button id="finishConsultButton" type="button">Finalizar consulta</button>
        </div>
      </div>
    </section>

    <iframe name="submitFrame" id="submitFrame" title="Envio de formulario"></iframe>
  </main>

  <script src="nomina.js"></script>
  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyCnHBe3NhPE5IABgTz89JDsk81LhZCkSLAJe3JwGSG09eGW-K6aUIl1WAiEPW06-KriA/exec';

    const NOMINA = window.NOMINA || [];
    const LOCALES_EXTRA = window.LOCALES_EXTRA || [];

    const form = document.querySelector('#hoursForm');
    const submitButton = document.querySelector('#submitButton');
    const statusBox = document.querySelector('#status');
    const frame = document.querySelector('#submitFrame');
    const dniInput = document.querySelector('#dni');
    const nombreInput = document.querySelector('#nombre');
    const localSelect = document.querySelector('#local');
    const employeeHint = document.querySelector('#employeeHint');
    const consultPanel = document.querySelector('#consultPanel');
    const openConsultButton = document.querySelector('#openConsultButton');
    const finishConsultButton = document.querySelector('#finishConsultButton');
    const consultDniInput = document.querySelector('#consultDni');
    const consultNombreInput = document.querySelector('#consultNombre');
    const consultHint = document.querySelector('#consultHint');
    const runConsultButton = document.querySelector('#runConsultButton');
    const consultStatus = document.querySelector('#consultStatus');
    const consultResult = document.querySelector('#consultResult');
    const resultName = document.querySelector('#resultName');
    const saldoHoras = document.querySelector('#saldoHoras');
    const saldoCard = document.querySelector('#saldoCard');
    const historyBody = document.querySelector('#historyBody');
    const today = new Date();
    const localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000);
    const employeesByDni = new Map(NOMINA.map(employee => [normalizeDni(employee.dni), employee]));

    document.querySelector('#fecha').value = localToday.toISOString().slice(0, 10);
    document.querySelector('#todayLabel').textContent = today.toLocaleDateString('es-AR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    });

    function normalizeDni(value) {
      return String(value || '').replace(/\D/g, '');
    }

    function setStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = type ? `status ${type}` : 'status';
    }

    function setConsultStatus(message, type) {
      consultStatus.textContent = message;
      consultStatus.className = type ? `status ${type}` : 'status';
    }

    function formatHours(value) {
      const number = Number(value || 0);
      return Number.isInteger(number) ? String(number) : number.toFixed(2);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getLocales() {
      const locales = new Set(LOCALES_EXTRA);
      NOMINA.forEach(employee => {
        if (employee.local) locales.add(employee.local);
      });
      return Array.from(locales)
        .filter(local => local !== 'RH')
        .sort((a, b) => a.localeCompare(b, 'es'));
    }

    function renderLocalOptions(selectedLocal) {
      const options = ['<option value="">Seleccionar local</option>'];
      getLocales().forEach(local => {
        const selected = local === selectedLocal ? ' selected' : '';
        options.push(`<option value="${local}"${selected}>${local}</option>`);
      });
      localSelect.innerHTML = options.join('');
    }

    function updateEmployeeFromDni() {
      const dni = normalizeDni(dniInput.value);
      dniInput.value = dni;

      if (!dni) {
        nombreInput.value = '';
        renderLocalOptions('');
        submitButton.disabled = true;
        employeeHint.textContent = 'Ingresar DNI sin puntos.';
        employeeHint.style.color = '';
        return;
      }

      const employee = employeesByDni.get(dni);
      if (!employee) {
        nombreInput.value = '';
        renderLocalOptions('');
        submitButton.disabled = true;
        employeeHint.textContent = 'DNI no encontrado en la nomina.';
        employeeHint.style.color = '#b42318';
        return;
      }

      nombreInput.value = employee.nombre;
      renderLocalOptions(employee.local);
      submitButton.disabled = false;
      employeeHint.textContent = 'Empleado encontrado.';
      employeeHint.style.color = '#067647';
    }

    renderLocalOptions('');
    dniInput.addEventListener('input', updateEmployeeFromDni);

    openConsultButton.addEventListener('click', () => {
      form.classList.add('hidden');
      consultPanel.classList.remove('hidden');
      consultDniInput.value = '';
      consultNombreInput.value = '';
      runConsultButton.disabled = true;
      consultResult.classList.add('hidden');
      setConsultStatus('', '');
      consultHint.textContent = 'Ingresar DNI sin puntos.';
      consultHint.style.color = '';
      consultDniInput.focus();
    });

    finishConsultButton.addEventListener('click', () => {
      consultPanel.classList.add('hidden');
      form.classList.remove('hidden');
    });

    consultDniInput.addEventListener('input', () => {
      const dni = normalizeDni(consultDniInput.value);
      consultDniInput.value = dni;
      consultResult.classList.add('hidden');

      if (!dni) {
        consultNombreInput.value = '';
        runConsultButton.disabled = true;
        consultHint.textContent = 'Ingresar DNI sin puntos.';
        consultHint.style.color = '';
        return;
      }

      const employee = employeesByDni.get(dni);
      if (!employee) {
        consultNombreInput.value = '';
        runConsultButton.disabled = true;
        consultHint.textContent = 'DNI no encontrado en la nomina.';
        consultHint.style.color = '#b42318';
        return;
      }

      consultNombreInput.value = employee.nombre;
      runConsultButton.disabled = false;
      consultHint.textContent = 'Empleado encontrado.';
      consultHint.style.color = '#067647';
    });

    runConsultButton.addEventListener('click', () => {
      const dni = normalizeDni(consultDniInput.value);
      if (!employeesByDni.has(dni)) {
        setConsultStatus('El DNI no esta en la nomina.', 'error');
        return;
      }

      setConsultStatus('Consultando...', 'warning');
      runConsultButton.disabled = true;
      consultResult.classList.add('hidden');

      const callbackName = `consultaHorasCallback_${Date.now()}`;
      const script = document.createElement('script');

      window[callbackName] = (response) => {
        delete window[callbackName];
        script.remove();
        runConsultButton.disabled = false;

        if (!response || !response.ok) {
          setConsultStatus(response?.error || 'No se pudo consultar el historial.', 'error');
          return;
        }

        renderConsultResult(response);
        setConsultStatus('', '');
      };

      script.onerror = () => {
        delete window[callbackName];
        script.remove();
        runConsultButton.disabled = false;
        setConsultStatus('No se pudo conectar con la consulta.', 'error');
      };

      script.src = `${WEB_APP_URL}?action=consulta&dni=${encodeURIComponent(dni)}&callback=${callbackName}`;
      document.body.appendChild(script);
    });

    function renderConsultResult(data) {
      const employee = employeesByDni.get(data.dni);
      const name = data.nombre || employee?.nombre || '';
      resultName.textContent = name;
      saldoHoras.textContent = formatHours(data.saldo);
      saldoCard.classList.remove('positive', 'negative');
      if (Number(data.saldo) > 0) saldoCard.classList.add('positive');
      if (Number(data.saldo) < 0) saldoCard.classList.add('negative');

      if (!data.historial.length) {
        historyBody.innerHTML = '<tr><td colspan="5">No hay cargas registradas para este DNI.</td></tr>';
      } else {
        historyBody.innerHTML = data.historial.map(row => `
          <tr>
            <td>${escapeHtml(row.fecha)}</td>
            <td>${escapeHtml(row.nombre || name)}</td>
            <td>${formatHours(row.horasAFavor)}</td>
            <td>${formatHours(row.horasADescontar)}</td>
            <td>${escapeHtml(row.motivo)}</td>
          </tr>
        `).join('');
      }

      consultResult.classList.remove('hidden');
    }

    form.addEventListener('submit', (event) => {
      if (WEB_APP_URL.includes('PEGAR_ACA')) {
        event.preventDefault();
        setStatus('Falta configurar la URL del Apps Script.', 'error');
        return;
      }

      if (!employeesByDni.has(normalizeDni(dniInput.value))) {
        event.preventDefault();
        setStatus('El DNI no esta en la nomina.', 'error');
        return;
      }

      form.action = WEB_APP_URL;
      submitButton.disabled = true;
      setStatus('Enviando...', 'warning');
    });

    frame.addEventListener('load', () => {
      if (!statusBox.textContent.includes('Enviando')) return;

      submitButton.disabled = true;
      form.reset();
      document.querySelector('#fecha').value = localToday.toISOString().slice(0, 10);
      nombreInput.value = '';
      renderLocalOptions('');
      employeeHint.textContent = 'Ingresar DNI sin puntos.';
      employeeHint.style.color = '';
      setStatus('Carga enviada correctamente.', 'ok');
    });
  </script>
</body>
</html>
